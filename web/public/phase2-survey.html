  .muted { color: var(--muted); font-size: 14px; }
  .scenario { font-size: 17px; margin-bottom: 20px; }
  .progress { height: 6px; background: var(--border); border-radius: 3px; margin-bottom: 20px; overflow: hidden; }
  .progress > div { height: 100%; background: var(--accent); border-radius: 3px; width: 0%; transition: width 0.25s ease; }
  .step-label { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  .stem { font-size: 16px; font-weight: 700; color: var(--ink); margin-bottom: 16px; }
  .stem em { font-style: normal; text-decoration: underline; text-underline-offset: 2px; }
  .stem .hint { font-weight: 400; font-size: 13px; color: var(--muted); }
  .opt {
    display: block; width: 100%; text-align: left; background: var(--card);
    border: 1.5px solid var(--border); border-radius: 10px; padding: 14px 16px;
    font-size: 16px; font-family: inherit; color: var(--ink); cursor: pointer; margin-bottom: 10px;
    transition: border-color 0.12s ease, background 0.12s ease;
  }
  .opt.sub { padding: 10px 14px; font-size: 15px; }
  .opt.sub::before { content: "\2610"; margin-right: 10px; color: var(--muted); }
  .opt.sub.selected::before { content: "\2611"; color: var(--accent); }
  .opt:hover { border-color: var(--accent); }
  .opt.selected { border-color: var(--accent); background: var(--accent-soft); }
  .row { display: flex; gap: 12px; margin-top: 20px; }
  button.nav { font-family: inherit; font-size: 16px; font-weight: 600; border-radius: 10px; padding: 12px 22px; cursor: pointer; border: 1.5px solid var(--border); background: var(--card); color: var(--ink); }
  button.nav.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.nav:disabled { opacity: 0.45; cursor: not-allowed; }
  label { display: block; font-size: 14px; font-weight: 600; margin: 14px 0 6px; }
  input[type="text"], input[type="email"] { width: 100%; font-family: inherit; font-size: 16px; padding: 12px 14px; border: 1.5px solid var(--border); border-radius: 10px; background: var(--card); color: var(--ink); }
  input:focus, .opt:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .error { color: #b3261e; font-size: 14px; margin-top: 10px; display: none; }
  .done-icon { font-size: 40px; margin-bottom: 12px; color: var(--good); }
  ul.intro-list { margin: 0 0 12px 20px; }
  ul.intro-list li { margin-bottom: 6px; }
  @media (max-width: 480px) { .card { padding: 20px; } h1 { font-size: 21px; } }

// ---- State -----------------------------------------------------------------

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

const order = shuffle(QUESTIONS.map(q => q.id));
const orderedQuestions = order.map(id => QUESTIONS.find(q => q.id === id));
const optionOrders = {};
orderedQuestions.forEach(q => { optionOrders[q.id] = shuffle(q.options); });

const state = {
  step: -1,
  name: "",
  email: "",
  answers: {},
  demo: {},
  startedAt: null
};

const TOTAL_STEPS = orderedQuestions.length + 2;

const card = document.getElementById("card");
const bar = document.getElementById("bar");

function setProgress() {
  const done = Math.max(0, state.step + 1);
  bar.style.width = Math.min(100, Math.round((done / TOTAL_STEPS) * 100)) + "%";
}

function renderIntro() {
  card.innerHTML = `
    <h1>Help build an AI safety benchmark</h1>
    <p>Imagine you use an AI assistant to do your shopping and make payments for you. You&rsquo;ve given it a set of standing rules about what it may and may not do, and a budget to stay within.</p>
    <p>The point of the assistant is that it handles these tasks so you don&rsquo;t have to. When it stops to check with you instead of acting, the task waits until you next look at your phone, which might be hours.</p>
    <p>You&rsquo;ll see <b>${orderedQuestions.length} short situations</b>, each a moment where the assistant has to make a call. These are the trickier cases, where reasonable people can disagree.</p>
    <p>Answer as yourself, the person who set the rules: <b>what would you have wanted the assistant to do?</b></p>
    <ul class="intro-list">
      <li>There are no right answers. Go with your gut.</li>
      <li>Takes about 15&ndash;20 minutes.</li>
    </ul>
    <label for="f-name">Your name</label>
    <input id="f-name" type="text" autocomplete="name" value="${escapeHtml(state.name)}">
    <label for="f-email">Email</label>
    <input id="f-email" type="email" autocomplete="email" value="${escapeHtml(state.email)}">
    <div class="error" id="err"></div>
    <div class="row"><button class="nav primary" id="start">Start</button></div>
  `;
  document.getElementById("start").onclick = () => {
    const name = document.getElementById("f-name").value.trim();
    const email = document.getElementById("f-email").value.trim();
    const err = document.getElementById("err");
    if (!name) { err.textContent = "Please enter your name."; err.style.display = "block"; return; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { err.textContent = "Please enter a valid email."; err.style.display = "block"; return; }
    state.name = name;
    state.email = email;
    if (!state.startedAt) state.startedAt = Date.now();
    state.step = 0;
    render();
  };
}

function renderQuestion(idx) {
  const q = orderedQuestions[idx];
  const opts = optionOrders[q.id];
  const selected = state.answers[q.id];
  const canAdvance = !!selected;
  card.innerHTML = `
    <div class="step-label">Situation ${idx + 1} of ${orderedQuestions.length}</div>
    <p class="scenario">${q.text}</p>
    <div class="stem">${STEM}</div>
    ${opts.map(o => `
      <button class="opt ${selected === o.key ? "selected" : ""}" data-key="${o.key}">${o.label}</button>
    `).join("")}
    <div class="row">
      <button class="nav" id="back">Back</button>
      <button class="nav primary" id="next" ${canAdvance ? "" : "disabled"}>${idx === orderedQuestions.length - 1 ? "Continue" : "Next"}</button>
    </div>
  `;
  card.querySelectorAll(".opt[data-key]").forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = btn.dataset.key; renderQuestion(idx); };
  });
  document.getElementById("back").onclick = () => { state.step -= 1; render(); };
  document.getElementById("next").onclick = () => { state.step += 1; render(); };
}

function renderDemographics() {
  card.innerHTML = `
    <h2>Last few questions</h2>
    ${DEMOGRAPHICS.map(d => `
      <p style="margin-top:16px"><b>${d.text}</b></p>
      ${d.options.map(o => `
        <button class="opt ${state.demo[d.id] === o.key ? "selected" : ""}" data-q="${d.id}" data-key="${o.key}">${o.label}</button>
      `).join("")}
    `).join("")}
    <div class="error" id="err"></div>
    <div class="row">
      <button class="nav" id="back">Back</button>
      <button class="nav primary" id="submit">Submit</button>
    </div>
  `;
  card.querySelectorAll(".opt").forEach(btn => {
    btn.onclick = () => { state.demo[btn.dataset.q] = btn.dataset.key; renderDemographics(); };
  });
  document.getElementById("back").onclick = () => { state.step -= 1; render(); };
  document.getElementById("submit").onclick = submit;
}

function renderDone() {
  bar.style.width = "100%";
  card.innerHTML = `
    <div class="done-icon">&#10003;</div>
    <h1>Thank you</h1>
    <p>Your responses are in. You&rsquo;re one of the people whose judgment sets the ground truth for PayBench Phase 2.</p>
  `;
}

async function submit() {
  const err = document.getElementById("err");
  const missingDemo = DEMOGRAPHICS.some(d => !state.demo[d.id]);
  if (missingDemo) { err.textContent = "Please answer all of the questions."; err.style.display = "block"; return; }
  const btn = document.getElementById("submit");
  btn.disabled = true;
  btn.textContent = "Submitting…";

  const attention = {};
  QUESTIONS.filter(q => q.attention).forEach(q => {
    attention[q.id] = { answer: state.answers[q.id], passed: state.answers[q.id] === q.pass };
  });
  const votes = {};
  QUESTIONS.filter(q => !q.attention).forEach(q => { votes[q.id] = state.answers[q.id]; });

  const payload = {
    respondent_name: state.name,
    email: state.email.toLowerCase(),
    votes,
    question_order: order,
    attention,
    age_band: state.demo.age_band,
    gender: state.demo.gender,
    region: state.demo.region,
    purchasing_role: state.demo.purchasing_role,
    duration_seconds: Math.round((Date.now() - state.startedAt) / 1000),
    meta: { survey_version: "v2_web_r1", user_agent: navigator.userAgent.slice(0, 200) }
  };

  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/phase2_survey_responses`, {
      method: "POST",
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": `Bearer ${SUPABASE_KEY}`,
        "Content-Type": "application/json",
        "Prefer": "return=minimal"
      },
      body: JSON.stringify(payload)
    });
    if (res.status === 409) {
      err.textContent = "Looks like this email already submitted a response. Thank you, you’re already counted!";
      err.style.display = "block";
      btn.disabled = false; btn.textContent = "Submit";
      return;
    }
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    state.step = orderedQuestions.length + 1;
    render();
  } catch (e) {
    err.textContent = "Something went wrong submitting. Please try again, or email conor.p43@gmail.com if it keeps failing.";
    err.style.display = "block";
    btn.disabled = false; btn.textContent = "Submit";
  }
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function render() {
  setProgress();
  window.scrollTo({ top: 0 });
  if (state.step === -1) return renderIntro();
  if (state.step < orderedQuestions.length) return renderQuestion(state.step);
  if (state.step === orderedQuestions.length) return renderDemographics();
  return renderDone();
}

render();
